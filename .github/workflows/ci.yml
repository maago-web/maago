name: ci

on: push

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - run: go version
      - name: gofmt
        # gofmt -l exits 0 even when it lists files; a parse error must fail too
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: root module
        run: go vet ./... && go test ./...
      - name: cmd/maago module
        working-directory: cmd/maago
        run: go mod tidy -diff && go vet ./... && go test ./...
