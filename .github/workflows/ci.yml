name: ci

on: push

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      MAAGO_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          cache: false
      - run: go version
      - name: gofmt
        # gofmt -l exits 0 even when it lists files; a parse error must fail too
        run: |
          out=$(gofmt -l .)
          test -z "$out" || { echo "$out"; exit 1; }
      - name: test
        # The board tutorial walks its steps again for each line of
        # TestBoardTutorialCatches: past the default 10 minutes.
        run: go mod tidy -diff && go vet ./... && go test -timeout 30m ./...
