{{define "content"}}<h1>Change your password</h1>
{{if .Changed}}<p>Your password was changed.</p>{{else}}
<form method="post" action="{{url "password_change_submit"}}">
{{with .Form.OldPassword}}<label for="{{.Name}}">Old password</label>
<input type="password" id="{{.Name}}" name="{{.Name}}" autocomplete="current-password" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
{{with .Form.NewPassword}}<label for="{{.Name}}">New password</label>
<input type="password" id="{{.Name}}" name="{{.Name}}" autocomplete="new-password" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
<button>Change password</button>
</form>{{end}}{{end}}
