{{define "content"}}<h1>Reset your password</h1>
{{if .Sent}}<p>If an account exists with that email, we've sent a link to reset its password.</p>{{else}}
<form method="post" action="{{url "password_reset_submit"}}">
{{with .Form.Email}}<label for="{{.Name}}">Email</label>
<input type="email" id="{{.Name}}" name="{{.Name}}" value="{{.Raw}}" autocomplete="username" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
<button>Email me a link</button>
</form>{{end}}{{end}}
