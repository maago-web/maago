{{define "content"}}<h1>Sign up</h1>
{{if .Sent}}<p>Check your email for a link to verify your account.</p>{{else}}
<form method="post" action="{{url "signup_submit"}}">
{{range .Form.Errors}}<p class="error">{{.}}</p>{{end}}
{{with .Form.Email}}<label for="{{.Name}}">Email</label>
<input type="email" id="{{.Name}}" name="{{.Name}}" value="{{.Raw}}" autocomplete="username" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
{{with .Form.Password}}<label for="{{.Name}}">Password</label>
<input type="password" id="{{.Name}}" name="{{.Name}}" autocomplete="new-password" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
<button>Sign up</button>
</form>{{end}}{{end}}
