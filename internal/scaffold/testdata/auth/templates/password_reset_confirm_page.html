{{define "content"}}<h1>Choose a new password</h1>
{{range .Form.Errors}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="{{url "password_reset_confirm_submit"}}">
<input type="hidden" name="token" value="{{.Token}}">
{{with .Form.Password}}<label for="{{.Name}}">New password</label>
<input type="password" id="{{.Name}}" name="{{.Name}}" autocomplete="new-password" required>{{if .Error}}<p class="error">{{.Error}}</p>{{end}}{{end}}
<button>Set password</button>
</form>{{end}}
